name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # llvm-cov counts test binaries, not doctests: the threshold is on the
      # suite in tests/, which is where the public surface is exercised.
      - name: Coverage gate (lines >= 95%)
        run: cargo llvm-cov --all-features --fail-under-lines 95 --summary-only

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: cargo-fuzz is on PATH
        run: cargo fuzz --version
      # cargo-fuzz defaults to the musl target on Linux, where ASan needs a
      # dynamically linked libc; pin the gnu target instead.
      - name: Build every parser target
        run: |
          for target in webhook_payload webhook_signature template_payload account_payload header_values; do
            cargo fuzz build --target x86_64-unknown-linux-gnu "$target"
          done
      - name: Run the committed seeds
        run: |
          for target in webhook_payload webhook_signature template_payload account_payload header_values; do
            cargo fuzz run --target x86_64-unknown-linux-gnu "$target" -- -runs=5000
          done

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
