[package]
name = "meta-whatsapp"
version = "0.1.4"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Typed client and webhook toolkit for the WhatsApp Cloud API (Meta Graph API)"
repository = "https://github.com/floffel/meta-whatsapp"
documentation = "https://docs.rs/meta-whatsapp"
keywords = ["whatsapp", "meta", "cloud-api", "webhook", "graph-api"]
categories = ["api-bindings", "web-programming"]
readme = "README.md"
exclude = [".github/**", "deny.toml", "fuzz/**"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["http"]
http = ["dep:reqwest", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
subtle = "2"
tokio = { version = "1", default-features = false, features = ["time"], optional = true }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[example]]
name = "send_text"
# The example sends over the bundled reqwest transport, so it needs `http`;
# without the feature Cargo would build a file that imports a gated type.
required-features = ["http"]
